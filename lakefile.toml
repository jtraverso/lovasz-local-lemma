name = "lovasz_local_lemma"
version = "0.1.0"
defaultTargets = ["LocalLemmaLib", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "LocalLemmaLib"
globs = ["LocalLemmaLib.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
