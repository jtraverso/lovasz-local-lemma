      lean: "LovaszLocalLemma.lll"
      module: "Challenge"
      status: "proved"
    - source: "Lovász Local Lemma, symmetric form"
      lean: "LovaszLocalLemma.lll_symmetric"
      module: "Challenge"
      status: "proved"
    - source: "Spencer (1977): Ramsey lower bound"
      lean: "LovaszLocalLemma.ramsey_lower"
      module: "Challenge"
      status: "proved"
    - source: "Erdős–Lovász (1975): property B"
      lean: "LovaszLocalLemma.propertyB"
      module: "Challenge"
      status: "proved"
    - source: "Property B for k-uniform hypergraphs with vertex degree at most k (k ≥ 9)"
      lean: "LovaszLocalLemma.propertyB_regular"
      module: "Challenge"
      status: "proved"

